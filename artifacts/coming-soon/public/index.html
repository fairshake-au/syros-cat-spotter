<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {

  img { max-width: 100%; }
  a { color: #135f92; }

  .wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px 0 6px; }
  .mark { display: flex; align-items: center; gap: 11px; }

  .langs { display: flex; gap: 8px; }
  .langs button {
    min-height: 44px; padding: 0 17px; font-family: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted); background: transparent;
    border: 1.5px solid var(--rule); border-radius: 999px; cursor: pointer;
  }
  .langs button[aria-pressed="true"] { color: var(--card); background: var(--blue); border-color: var(--blue); }

  .hero { display: grid; grid-template-columns: 1fr; gap: 36px; align-items: center; padding: 32px 0 56px; }

  input[type=email] {

  button.cta {
    min-height: 56px; padding: 0 28px; font-family: 'Poppins', sans-serif; font-size: 17px; font-weight: 600;
    color: var(--card); background: var(--blue); border: none; border-radius: 999px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(27,42,56,.16);
  }
  button.cta:disabled { opacity: .6; cursor: default; }

  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .note { font-size: 14px; color: var(--faint); padding-left: 20px; }
  .err { font-size: 14px; color: var(--clay); padding-left: 20px; }
  .done { display: flex; gap: 15px; align-items: flex-start; max-width: 520px; padding: 22px 26px; background: var(--card); border: 1.5px solid #cbd6a8; border-radius: 20px; }
  .done h3 { font-size: 19px; font-weight: 600; color: var(--ink); }
  .done p { font-size: 15px; color: var(--body); }

  .cards { display: grid; grid-template-columns: 1fr; gap: 22px; }
  .card { display: flex; flex-direction: column; gap: 12px; padding: 28px; background: var(--page); border: 1.5px solid var(--line); border-radius: 20px; }
  .card-head { display: flex; align-items: center; gap: 14px; }
  .icon { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 14px; }
  .card h3 { font-size: 21px; font-weight: 600; color: var(--ink); }
  .card p { font-size: 16px; }

  .why { display: flex; flex-direction: column; gap: 18px; align-items: center; text-align: center; padding: 64px 0; }
  .why p { font-size: clamp(1rem, 2vw, 1.125rem); line-height: 1.65; max-width: 62ch; text-wrap: pretty; }

  .close { background: var(--navy); padding: 60px 0; }
  .close .inner { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .close h2 { color: var(--card); max-width: 20ch; }
  .close .note { color: var(--sky); padding: 0; }
  .close input[type=email] { border-color: #135f92; }
  .close button.cta { color: var(--navy); background: var(--sun); }
  .close .done { background: transparent; border-color: #135f92; }
  .close .done h3 { color: var(--card); }
  .close .done p { color: var(--sky); }

  footer { background: var(--night); padding: 34px 0; }
  footer .inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  footer .dsp { font-size: 17px; font-weight: 600; color: #e9edf0; }
  footer p { font-size: 14px; line-height: 1.55; color: var(--faint); }
  footer a { color: var(--sky); font-weight: 700; border-bottom: 1px solid #135f92; text-decoration: none; }
  footer a:hover { color: var(--card); }

  @media (min-width: 900px) {
    .hero { grid-template-columns: 1.02fr 1fr; gap: 60px; padding: 48px 0 80px; }
    .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; }
    .band { padding: 72px 0; }
    .why { padding: 84px 0; }
  }
  @media (prefers-reduced-motion: no-preference) {
    button.cta, .langs button { transition: background-color 200ms cubic-bezier(.4,0,.2,1), color 200ms cubic-bezier(.4,0,.2,1); }
  }

    });
    document.querySelectorAll('.langs button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });
    current = lang;
    try { localStorage.setItem('cs-lang', lang); } catch (e) {}
  }

  var current = initial;
  apply(initial);

  document.querySelectorAll('.langs button').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.lang); });
  });

  document.querySelectorAll('form[data-signup]').forEach(function (form) {
    var done = form.parentElement.querySelector('[data-done]');
    var err = form.querySelector('[data-err]');
    var btn = form.querySelector('button.cta');

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var email = form.elements.email.value.trim();
      var widget = form.querySelector('.cf-turnstile');
      var tokenField = form.elements['cf-turnstile-response'];
      var token = tokenField ? tokenField.value : '';
      err.hidden = true;
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
        err.textContent = COPY[current].err;
        err.hidden = false;
        return;
      }
      if (!token) {
        err.textContent = COPY[current].verify;
        err.hidden = false;
        return;
      }
      btn.disabled = true;
      fetch('/api/subscribe', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email: email, lang: current, website: form.elements.website.value, token: token })
      })
        .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || 'failed');
          form.hidden = true;
          if (done) done.hidden = false;
        })
        .catch(function () {
          err.textContent = COPY[current].failed;
          err.hidden = false;
          btn.disabled = false;
          if (window.turnstile && widget) window.turnstile.reset(widget);
        });
    });
  });
})();
</script>
</body>
</html>

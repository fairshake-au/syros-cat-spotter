kind = "mobile"
previewPath = "/"
title = "Syros Cat Spotter"
version = "1.0.0"
id = "artifacts/cat-spotter"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23789

[services.development]
run = "pnpm --filter @workspace/cat-spotter run dev"

# Production serves the WEB export (a real website in the browser), not the
# Expo Go bundles. The Expo Go pipeline (scripts/build.js + server/serve.js)
# remains available for phone demos via `run build` / `run serve`.
[services.production]
build = [ "pnpm", "--filter", "@workspace/cat-spotter", "run", "build:web" ]
run = [ "pnpm", "--filter", "@workspace/cat-spotter", "run", "serve:web" ]

[services.env]
PORT = "23789"
BASE_PATH = "/"

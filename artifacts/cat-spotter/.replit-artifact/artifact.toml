kind = "mobile"
previewPath = "/"
title = "Syros Cat Spotter"
version = "1.0.0"
id = "artifacts/cat-spotter"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23789

[services.development]
run = "pnpm --filter @workspace/cat-spotter run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cat-spotter", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cat-spotter", "run", "serve" ]

[services.env]
PORT = "23789"
BASE_PATH = "/"

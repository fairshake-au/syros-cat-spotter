name: CI

on:
  # A change that touches only documents (specs, plans, screenshots, notes)
  # can't break the code, so it doesn't spend Actions minutes (the free plan's
  # 2,000 a month ran out on 12 Oct 2026). A PR that changes any other file
  # still runs everything.
  #
  # Except docs/specs/source/: welfareGuidance.test.ts reads
  # safety-copy-translations.md there and checks the Greek and French urgent
  # block against it, so a change to that folder must run the tests. The "!"
  # line goes LAST: later patterns win, and "**/*.md" would re-ignore it. Any
  # new test that reads a document needs the same exception here.
  #
  # A draft PR doesn't run either: PRs are opened as drafts, fixed up through
  # review, and marked ready once, which runs the checks then (ready_for_review).
  # In the run history for 14-16 Oct 2026, about 1,530 of 2,850 CI minutes
  # went on runs a newer push cancelled or that failed mid-review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "attached_assets/**"
      - "**/*.md"
      - "!docs/specs/source/**"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "attached_assets/**"
      - "**/*.md"
      - "!docs/specs/source/**"

# A newer push to the same PR replaces the run still going for the older one.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    # Pushes to main always run; a PR runs only once it's out of draft.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: catspotter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/catspotter_test
      # The OpenAI client throws at import time unless these are set. Every
      # test mocks the matcher that would use them, so no real call is ever
      # made — these are dummy values, not secrets.
      AI_INTEGRATIONS_OPENAI_BASE_URL: http://127.0.0.1:9
      AI_INTEGRATIONS_OPENAI_API_KEY: ci-dummy-not-a-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security patches are applied (braces, node-forge)
        run: pnpm run test:dependency-security

      - name: Migrations match the schema code, and each has a rollback
        run: pnpm --filter @workspace/db run migrate:check

      - name: Test migrations (runner, and up/down/up of the real history)
        run: pnpm --filter @workspace/db test

      - name: Typecheck libs
        run: pnpm run typecheck:libs

      - name: Typecheck cat-spotter (mobile app)
        run: pnpm --filter @workspace/cat-spotter run typecheck

      - name: Typecheck api-server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Test lib/geo (the shared "nearby" rule)
        run: pnpm --filter @workspace/geo test

      - name: Test lib/map-style (the shared map style, SYC-705)
        run: pnpm --filter @workspace/map-style test

      - name: Test cat-spotter (mobile app)
        run: pnpm --filter @workspace/cat-spotter test

      - name: Set up Python (map-data scripts, SYC-705)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/map-data/requirements.txt

      - name: Test the map-data scripts (SYC-705)
        run: |
          python -m pip install -r scripts/map-data/requirements.txt
          python -m pytest -q scripts/map-data

      - name: Test the mail-drain Worker (SYC-231)
        run: node --test 'infra/mail-drain-cron/test/*.test.mjs'

      - name: Test api-server
        run: pnpm --filter @workspace/api-server test

      - name: Build web export
        run: pnpm --filter @workspace/cat-spotter run build:web

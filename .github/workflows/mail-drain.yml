name: mail-drain
# SYC-42 plan, Slice 1 item 1.6, layer 3: asks the API to send any queued
# mail (cat-report alerts to Syros Cats).
#
# SYC-231: the main caller is now the `mail-drain-cron` Cloudflare Worker
# (infra/mail-drain-cron), every 10 minutes. GitHub ran this workflow's
# "every 10 minutes" every 3-7 hours, too slow for the over-an-hour alarm.
# This stays as a BACKUP, every 2 hours (GitHub may run it later), and for
# manual runs. Two callers at once is safe: each email is claimed once.
# Runbook: docs/runbooks/mail-drain.md.
#
# If a cat-report alert has been unsent for over an hour, the API answers
# non-2xx, this run FAILS, and GitHub emails Samuel about the failed run.
# (The Worker emails him too, through Cloudflare.) That's a different
# delivery path from Resend. It's about the system being broken, not about
# a cat, and it pages nobody (F1).
#
# MAIL_DRAIN_TOKEN is a GitHub `production` Environment secret, a Replit
# deployment secret and a Worker secret, never in a file or a prompt (spec
# §2.11). It opens one path only: POST /api/internal/mail/drain.
on:
  schedule:
    # Off the hour, when GitHub's schedule queue is least busy.
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        type: string
        required: false
        description: "https://apptest.catspotters.com or localhost only. Defaults to the production variable MAIL_DRAIN_BASE_URL, then https://apptest.catspotters.com"
permissions: { contents: read }
concurrency: { group: "mail-drain", cancel-in-progress: false }
jobs:
  drain:
    # Off until the rollout switches it on (repo variable MAIL_DRAIN_ENABLED =
    # true, set once the migration, RESEND_API_KEY and MAIL_DRAIN_TOKEN are
    # live), so it doesn't fail every 10 minutes before then. A manual run
    # always goes.
    if: ${{ vars.MAIL_DRAIN_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Drain the mail outbox
        env:
          MAIL_DRAIN_TOKEN: ${{ secrets.MAIL_DRAIN_TOKEN }}
          BASE_URL: ${{ inputs.base_url || vars.MAIL_DRAIN_BASE_URL || 'https://apptest.catspotters.com' }}
        run: |
          set -euo pipefail
          if [ -z "${MAIL_DRAIN_TOKEN}" ]; then
            echo "::error::MAIL_DRAIN_TOKEN is not set in the production environment"
            exit 1
          fi
          # The token only ever goes to the app: a manual run's base_url must
          # be the production host or localhost (review of #55).
          rest="${BASE_URL#*://}"
          scheme="${BASE_URL%%://*}"
          host="${rest%%/*}"
          host="${host%%:*}"
          case "${scheme}://${host}" in
            https://apptest.catspotters.com|http://localhost|http://127.0.0.1) ;;
            *)
              echo "::error::base_url must be https://apptest.catspotters.com or localhost"
              exit 1
              ;;
          esac
          out="$(mktemp)"
          # The first call can wake a sleeping deployment; retry once on a
          # connection error or a 502/503/504 from the platform. On a
          # connection error curl itself prints 000 and exits non-zero, so the
          # exit is ignored rather than adding a second 000 (review S6).
          for attempt in 1 2; do
            code=$(curl -sS -o "$out" -w '%{http_code}' --max-time 90 \
              -X POST -H "Authorization: Bearer ${MAIL_DRAIN_TOKEN}" \
              "${BASE_URL%/}/api/internal/mail/drain") || true
            code="${code:-000}"
            case "$code" in 000*|502|503|504) [ "$attempt" = 1 ] && sleep 20 && continue ;; esac
            break
          done
          echo "HTTP ${code}"
          cat "$out" || true
          echo
          if [ "$code" != "200" ]; then
            if grep -q welfare_alert_overdue "$out" 2>/dev/null; then
              echo "::error::A cat-report alert to Syros Cats has been unsent for over an hour. Check RESEND_API_KEY and WELFARE_ALERT_TO in Replit, and Resend's log."
            else
              echo "::error::The mail drain call failed (HTTP ${code})."
            fi
            exit 1
          fi

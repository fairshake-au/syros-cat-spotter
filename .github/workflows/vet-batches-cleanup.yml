name: vet-batches-cleanup
# SYC-677: once a day, asks the API to remove unsaved vet visit batches that
# have not been touched for 7 days, together with their staged photos. The
# app answers with counts only ({"removed": N, "failed": M}), never a batch, a
# person or a photo, and this run prints that answer and nothing more. If any
# batch could not be removed the app answers 500, so the run fails and GitHub
# emails.
#
# OFF until the rollout switches it on: set the repo variable
# VET_BATCH_CLEANUP_ENABLED = true once the vet_batches migration is live.
# Until then the scheduled run skips (a manual run always goes), so it doesn't
# fail every day before the table exists.
#
# MAIL_DRAIN_TOKEN is the same GitHub `production` Environment secret the mail
# drain uses. The token only ever goes to the app (this run's base_url must be
# the production host or localhost), and it is never printed or written to a
# file. The route checks it on the server as well.
on:
  schedule:
    # Once a day, off the hour, when GitHub's schedule queue is least busy.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        type: string
        required: false
        description: "https://apptest.catspotters.com or localhost only. Defaults to the production variable MAIL_DRAIN_BASE_URL, then https://apptest.catspotters.com"
permissions: { contents: read }
concurrency: { group: "vet-batches-cleanup", cancel-in-progress: false }
jobs:
  cleanup:
    # Off until the rollout switches it on (repo variable
    # VET_BATCH_CLEANUP_ENABLED = true). A manual run always goes.
    if: ${{ vars.VET_BATCH_CLEANUP_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 5
    steps:
      - name: Remove stale unsaved vet batches
        env:
          MAIL_DRAIN_TOKEN: ${{ secrets.MAIL_DRAIN_TOKEN }}
          BASE_URL: ${{ inputs.base_url || vars.MAIL_DRAIN_BASE_URL || 'https://apptest.catspotters.com' }}
        run: |
          set -euo pipefail
          if [ -z "${MAIL_DRAIN_TOKEN}" ]; then
            echo "::error::MAIL_DRAIN_TOKEN is not set in the production environment"
            exit 1
          fi
          # The token only ever goes to the app: a manual run's base_url must
          # be the production host or localhost.
          # No user-info: "https://apptest.catspotters.com:pw@evil.example.com"
          # would pass the host check below but send the token to evil.example.com.
          case "${BASE_URL}" in
            *@*)
              echo "::error::base_url must not contain '@'"
              exit 1
              ;;
          esac
          rest="${BASE_URL#*://}"
          scheme="${BASE_URL%%://*}"
          host="${rest%%/*}"
          host="${host%%:*}"
          case "${scheme}://${host}" in
            https://apptest.catspotters.com|http://localhost|http://127.0.0.1) ;;
            *)
              echo "::error::base_url must be https://apptest.catspotters.com or localhost"
              exit 1
              ;;
          esac
          out="$(mktemp)"
          # The first call can wake a sleeping deployment; retry once on a
          # connection error or a 502/503/504 from the platform. On a
          # connection error curl itself prints 000 and exits non-zero, so the
          # exit is ignored rather than adding a second 000.
          for attempt in 1 2; do
            code=$(curl -sS -o "$out" -w '%{http_code}' --max-time 90 \
              -X POST -H "Authorization: Bearer ${MAIL_DRAIN_TOKEN}" \
              "${BASE_URL%/}/api/internal/vet-batches/cleanup") || true
            code="${code:-000}"
            case "$code" in 000*|502|503|504) [ "$attempt" = 1 ] && sleep 20 && continue ;; esac
            break
          done
          echo "HTTP ${code}"
          cat "$out" || true
          echo
          case "$code" in
            2??) ;;
            *)
              echo "::error::The vet batch clean-up call failed (HTTP ${code})."
              exit 1
              ;;
          esac

name: db-ops
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [development, rehearsal, production]
        required: true
      command:
        type: choice
        required: true
        options:
          [
            fingerprint-source,
            copy-rehearsal,
            copy-cutover,
            verify,
            migrate,
            migrate-rollback,
            smoke,
            carry-back-dry-run,
            carry-back-apply,
          ]
      base_url:
        type: string
        required: false
        description: "For smoke: defaults to https://apptest.catspotters.com"
      confirm:
        type: string
        required: false
        description: "Type APPLY for carry-back-apply"
      fail_after:
        # The plan sketches this as `type: choice` with `""` as one of the
        # options, but actionlint refuses an empty choice option
        # (syntax-check). Left as a free string, defaulting to empty (no
        # simulated failure); scripts/db-ops.sh validates it's one of
        # restore/compare/fingerprint (or empty) and refuses anything else.
        type: string
        required: false
        description: "D.8 drill only: restore, compare or fingerprint. Refused unless target=rehearsal"
permissions: { contents: read }
concurrency: { group: "db-ops-${{ inputs.target }}", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Postgres 16 client, age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 age
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Run
        env:
          TARGET: ${{ inputs.target }}
          COMMAND: ${{ inputs.command }}
          BASE_URL: ${{ inputs.base_url }}
          CONFIRM: ${{ inputs.confirm }}
          NEON_URL: ${{ inputs.target == 'production' && secrets.NEON_PROD_DIRECT_URL || inputs.target == 'rehearsal' && secrets.NEON_REHEARSAL_DIRECT_URL || secrets.NEON_DEV_DIRECT_URL }}
          # Not in the plan's Part B.4 sketch verbatim, but needed for two
          # behaviours the same section describes in prose: copy-rehearsal
          # into production also restores into the rehearsal branch (needs
          # the rehearsal URL even though target=production), and
          # carry-back's source is always Neon production even when
          # target=rehearsal. Both secrets live in the same "production"
          # Environment as NEON_URL when target isn't development, so this
          # adds no new secret exposure, just two more references to
          # secrets already in scope for this job.
          NEON_PROD_URL: ${{ inputs.target != 'development' && secrets.NEON_PROD_DIRECT_URL || '' }}
          NEON_REHEARSAL_URL: ${{ inputs.target != 'development' && secrets.NEON_REHEARSAL_DIRECT_URL || '' }}
          REPLIT_URL: ${{ secrets.REPLIT_PROD_DATABASE_URL }}
          PRELAUNCH_KEY: ${{ secrets.PRELAUNCH_TESTER_KEY }}
          # From the Environment's variables (A.2); rehearsal shares the production Environment.
          DATABASE_TARGET: ${{ inputs.target == 'rehearsal' && 'rehearsal' || vars.DATABASE_TARGET }}
          FAIL_AFTER: ${{ inputs.fail_after }}
          # Q6: the public key only; copy-cutover encrypts the dump with age and uploads it (7-day artifact)
          DUMP_AGE_RECIPIENT: ${{ vars.DUMP_AGE_RECIPIENT }}
        run: bash scripts/db-ops.sh
      - name: Upload encrypted dump (copy-cutover only, if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-ops-encrypted-dump-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/db-ops-dump.age
          if-no-files-found: ignore
          retention-days: 7

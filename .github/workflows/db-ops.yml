name: db-ops
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [development, rehearsal, production]
        required: true
      command:
        type: choice
        required: true
        options:
          [
            fingerprint-source,
            copy-rehearsal,
            copy-cutover,
            verify,
            verify-history,
            migrate,
            migrate-rollback,
            smoke,
            carry-back-dry-run,
            carry-back-apply,
            people-add,
            people-list,
            people-set-roles,
            people-mark-left,
            people-sign-out-everywhere,
            set-setting,
            list-settings,
          ]
      people_role:
        # SYC-43: a fixed list, validated again by scripts/db-ops.sh, the
        # people CLI and the database. The person's email and name are never
        # inputs: they come from the short-lived PEOPLE_EMAIL, PEOPLE_NAME and
        # PEOPLE_EMAIL_CONFIRM Environment secrets (SYC-121 plan H.1(b)).
        # SYC-53 PR 0.3: volunteer is retired; management is given only by
        # people-set-roles (people-add refuses it).
        type: choice
        # No default (review M1): a set-roles run must name the role, so a
        # forgotten input can never mean "remove staff".
        options: [staff, management, guardian, vet]
        required: false
        description: "For people-add: the role to give. For people-set-roles: the one role to add or remove"
      people_change:
        # SYC-53 PR 0.3: set-roles is additive, one role at a time. A whole
        # new list is CLI-only (--replace). No default: the change is always
        # named. Removing staff also needs CONFIRM=FORCE: until SYC-53 PR 0.5
        # only staff lets anyone sign in.
        type: choice
        options: [add, remove]
        required: false
        description: "For people-set-roles: add or remove people_role"
      people_colony:
        type: string
        required: false
        description: "For a cat guardian (people-add, people-set-roles): the colony's number"
      setting_key:
        # SYC-36 / SYC-48 (match-wait plan PR 1): the match-wait switches.
        # A fixed list, checked again by the settings CLI.
        type: choice
        options: [feed_nudge_donate_url, starter_facts_hidden, feed_tap_count]
        required: false
        description: "For set-setting: which switch"
      setting_value:
        type: string
        required: false
        description: 'For set-setting: the value as JSON, e.g. "https://syroscats.com/donations" (quotes included), "" to switch the link off, ["fact.earTip"], [] or false'
      base_url:
        type: string
        required: false
        description: "For smoke: defaults to https://apptest.catspotters.com"
      confirm:
        type: string
        required: false
        description: "Type APPLY for carry-back-apply; FORCE for the people break-glass (set-roles past a guard, or mark-left of the last manager)"
      fail_after:
        # The plan sketches this as `type: choice` with `""` as one of the
        # options, but actionlint refuses an empty choice option
        # (syntax-check). Left as a free string, defaulting to empty (no
        # simulated failure); scripts/db-ops.sh validates it's one of
        # restore/compare/fingerprint (or empty) and refuses anything else.
        type: string
        required: false
        description: "D.8 drill only: restore, compare or fingerprint. Refused unless target=rehearsal"
permissions: { contents: read }
# One group for every target: carry-back and copy-rehearsal touch two
# branches at once, so runs on different targets mustn't overlap either.
concurrency: { group: "db-ops", cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Postgres 16 client, age
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 age
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Run
        env:
          TARGET: ${{ inputs.target }}
          COMMAND: ${{ inputs.command }}
          BASE_URL: ${{ inputs.base_url }}
          CONFIRM: ${{ inputs.confirm }}
          # One variable per branch, each read from its own secret only.
          # scripts/db-ops.sh picks the target's address by name, so an
          # empty secret can never fall through to another branch's address
          # (an `a && x || b && y || z` chain would). The dev secret lives in
          # the development Environment, the other two in production, so
          # each job only ever sees its own Environment's secrets.
          # (Beyond the plan's B.4 sketch: copy-rehearsal into production
          # also restores the rehearsal branch, and carry-back's source is
          # always Neon production, so both are needed with target=rehearsal
          # or production.)
          NEON_PROD_URL: ${{ secrets.NEON_PROD_DIRECT_URL }}
          NEON_REHEARSAL_URL: ${{ secrets.NEON_REHEARSAL_DIRECT_URL }}
          NEON_DEV_URL: ${{ secrets.NEON_DEV_DIRECT_URL }}
          REPLIT_URL: ${{ secrets.REPLIT_PROD_DATABASE_URL }}
          PRELAUNCH_KEY: ${{ secrets.PRELAUNCH_TESTER_KEY }}
          # From the Environment's variables (A.2); rehearsal shares the production Environment.
          DATABASE_TARGET: ${{ inputs.target == 'rehearsal' && 'rehearsal' || vars.DATABASE_TARGET }}
          FAIL_AFTER: ${{ inputs.fail_after }}
          # Q6: the public key only; copy-cutover encrypts the dump with age and uploads it (7-day artifact)
          DUMP_AGE_RECIPIENT: ${{ vars.DUMP_AGE_RECIPIENT }}
          # SYC-43 people-add: short-lived Environment secrets, set just before
          # the run and deleted straight after. Masked by GitHub and again by
          # the script's first lines; never echoed.
          PEOPLE_EMAIL: ${{ secrets.PEOPLE_EMAIL }}
          PEOPLE_NAME: ${{ secrets.PEOPLE_NAME }}
          # SYC-131: the address a second time. Every people command that names
          # a person refuses unless it equals PEOPLE_EMAIL.
          PEOPLE_EMAIL_CONFIRM: ${{ secrets.PEOPLE_EMAIL_CONFIRM }}
          PEOPLE_ROLE: ${{ inputs.people_role }}
          PEOPLE_CHANGE: ${{ inputs.people_change }}
          PEOPLE_COLONY: ${{ inputs.people_colony }}
          SETTING_KEY: ${{ inputs.setting_key }}
          SETTING_VALUE: ${{ inputs.setting_value }}
        run: bash scripts/db-ops.sh
      - name: Upload encrypted dump (copy-cutover only, if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-ops-encrypted-dump-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/db-ops-dump.age
          if-no-files-found: ignore
          retention-days: 7

name: map-data
# Builds our own Syros map (syros.pmtiles from OpenStreetMap, plus fonts, sprites,
# styles) and uploads it to the cat-spotters-map R2 bucket (tiles.catspotters.com).
# Manual only: run it when the map should be refreshed. SYC-705.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    # The three R2 secrets exist only in the "production" environment.
    environment: production
    # A cold run downloads ~2.3 GB of polygon data (about 50 minutes); cached runs take minutes.
    timeout-minutes: 120
    env:
      R2_BUCKET: cat-spotters-map
      AWS_DEFAULT_REGION: auto
      # R2 does not accept the newer default AWS CLI checksum headers.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Keep in step with BASEMAPS_COMMIT in scripts/map-data/build.sh (cache key only).
      BASEMAPS_COMMIT: ca93fc06efbaff1c5f069d06edbe5de18839c1c8
      PLANETILER_VERSION: "0.10.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install tools
        run: |
          sudo apt-get update
          # Maven is installed explicitly rather than relying on the runner image.
          # osmium-tool is deliberately NOT pinned (Ubuntu's package); its exact version
          # is printed below and recorded in manifest.json.
          sudo apt-get install -y maven osmium-tool
          osmium --version | head -1
          mvn -version | head -1
          python -m pip install -r scripts/map-data/requirements.txt
          pnpm install --frozen-lockfile --filter @workspace/map-style...

      # Cache only the slow, stable downloads and the built jar. Never cache
      # greece.osm.pbf or anything made from it: the OSM data must be fresh each run.
      - name: Restore Planetiler sources and the basemaps jar
        uses: actions/cache/restore@v4
        with:
          path: |
            .map-work/planetiler/data/sources
            .map-work/protomaps-basemap-${{ env.BASEMAPS_COMMIT }}.jar
            .map-work/planetiler.version
          key: map-sources-${{ env.BASEMAPS_COMMIT }}-planetiler-${{ env.PLANETILER_VERSION }}

      - name: Run the map-data tests
        run: python -m pytest -q scripts/map-data

      - name: Choose the next version number from the bucket
        id: version
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # The bucket is authoritative (current.json is cached at the edge). The listing is a
          # normal API call: an empty bucket succeeds with no prefixes (N=1) and ANY error
          # (non-zero exit) fails the job. N = highest existing v<number>/ folder + 1.
          # A failed partial upload leaves an unreferenced folder; the next run simply
          # takes N+1. Nothing is ever overwritten or deleted.
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --delimiter / --output json > "$RUNNER_TEMP/versions.json"
          NEXT=$(python scripts/map-data/r2_ls.py next-version < "$RUNNER_TEMP/versions.json")
          echo "N=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Build the map
        env:
          VERSION: ${{ steps.version.outputs.N }}
          REFRESH: "1"   # always download a fresh Greece extract in CI
        run: scripts/map-data/build.sh out .map-work

      # Save even when a later step fails, so a cold run keeps its ~2.3 GB of downloads.
      - name: Save Planetiler sources and the basemaps jar
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .map-work/planetiler/data/sources
            .map-work/protomaps-basemap-${{ env.BASEMAPS_COMMIT }}.jar
            .map-work/planetiler.version
          key: map-sources-${{ env.BASEMAPS_COMMIT }}-planetiler-${{ env.PLANETILER_VERSION }}

      - name: Sanity-check syros.pmtiles size (500 KB to 50 MB)
        env:
          N: ${{ steps.version.outputs.N }}
        run: |
          SIZE=$(stat -c %s "out/v$N/syros.pmtiles")
          echo "syros.pmtiles is $SIZE bytes"
          if [ "$SIZE" -lt 512000 ] || [ "$SIZE" -gt 52428800 ]; then
            echo "::error::syros.pmtiles size $SIZE is outside 500 KB to 50 MB; not uploading"
            exit 1
          fi

      - name: Upload to R2 (current.json last)
        env:
          N: ${{ steps.version.outputs.N }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Refuse to write into a version folder that already has anything in it.
          # Any aws error (non-zero exit) fails the step; an empty prefix is a success.
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --prefix "v$N/" --max-keys 1 --max-items 1 --output json > "$RUNNER_TEMP/guard.json"
          EXISTING=$(python scripts/map-data/r2_ls.py count < "$RUNNER_TEMP/guard.json")
          if [ "$EXISTING" -ne 0 ]; then
            echo "::error::s3://$R2_BUCKET/v$N/ is not empty; refusing to overwrite"
            exit 1
          fi
          CC="public, max-age=31536000, immutable"
          up() { # pattern content-type
            aws s3 cp --recursive --endpoint-url "$R2_ENDPOINT" "out/v$N" "s3://$R2_BUCKET/v$N" \
              --exclude "*" --include "$1" --content-type "$2" --cache-control "$CC"
          }
          up "*.pmtiles" application/octet-stream
          up "*.pbf" application/x-protobuf
          up "*.json" application/json
          up "*.png" image/png
          up "*.csv" text/csv
          up "*.txt" text/plain
          # Anything not covered above would be silently skipped: fail if the counts differ.
          LOCAL=$(find "out/v$N" -type f | wc -l)
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" --endpoint-url "$R2_ENDPOINT" \
            --prefix "v$N/" --output json > "$RUNNER_TEMP/after.json"
          REMOTE=$(python scripts/map-data/r2_ls.py count < "$RUNNER_TEMP/after.json")
          if [ "$LOCAL" -ne "$REMOTE" ]; then
            echo "::error::uploaded $REMOTE of $LOCAL files"
            exit 1
          fi
          aws s3 cp --endpoint-url "$R2_ENDPOINT" out/current.json "s3://$R2_BUCKET/current.json" \
            --content-type application/json --cache-control "public, max-age=300"

      - name: Keep the build record
        uses: actions/upload-artifact@v4
        with:
          name: map-v${{ steps.version.outputs.N }}-manifest
          path: out/v${{ steps.version.outputs.N }}/manifest.json

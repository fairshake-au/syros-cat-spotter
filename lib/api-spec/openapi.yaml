openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Syros Cat Spotter API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cats
    description: Cat catalog
  - name: sightings
    description: Cat sightings and matching
  - name: profiles
    description: Device profiles, points, badges
  - name: notifications
    description: Cat update notifications and push tokens
  - name: issues
    description: Report an issue with a cat or a photo
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cats:
    get:
      operationId: listCats
      tags: [cats]
      summary: One page of the catalogue (always the public, blurred view)
      description: |
        Paged (cat-record-data-spine.md §2.3). Walk `nextPage` until it is
        null to get every cat. Every cat is the public view: lat/lng are the
        centre of its 250 m cell (§6.2, §10.6).
      parameters:
        - name: lat
          in: query
          required: false
          schema: { type: number }
        - name: lng
          in: query
          required: false
          schema: { type: number }
        - name: page
          in: query
          required: false
          description: 1-based page number. Defaults to 1.
          schema: { type: integer, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          description: Cats per page. Defaults to 100; at most 200.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: |
            Sorted by distance to each cat's published cell (rounded to
            100 m) when lat/lng are given, otherwise by last-seen date,
            newest first. Ties always break on cat id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatPage"
  /cats/{catId}:
    get:
      operationId: getCat
      tags: [cats]
      summary: Get a cat with its sighting history
      description: |
        Public view by default. A device that owns this cat, sending its id
        in X-Device-Id with its X-Device-Secret, sees the cat's exact
        position (§10.6 Option B). Anything less is the public view, with no
        error.
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
        - name: X-Device-Id
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Cat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCat
      tags: [cats]
      summary: Rename a cat or update its home description (owner only)
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatOwnerUpdate"
      responses:
        "200":
          description: Updated cat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "403":
          description: Device is not the owner of this cat (code NOT_OWNER), or the device secret was refused
        "404":
          description: Not found
  /cats/{catId}/claim:
    post:
      operationId: claimCat
      tags: [cats]
      summary: Say "This is my cat" (claiming-a-cat.md §3, §11)
      description: |
        Needs the device secret. The server checks, in this order, and
        refuses at the first that fails: the cat lives on the street with
        no owner, and this phone has met it (403 NOT_MET, 409
        ALREADY_HOMED, 409 NOT_ON_STREET); both confirmations (422
        NOT_CONFIRMED); the home pin within 1 km of the cat's public
        position (422 PIN_TOO_FAR). No refusal says how far, or in which
        direction, the pin is out. The same owner claiming again is 200
        with nothing written. Five attempts per phone per 24 hours,
        refusals included (429 CLAIM_LIMIT); a phone that let this cat go
        in the last 7 days gets 429 CLAIM_COOLDOWN. The app reads `code`.
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatClaim"
      responses:
        "200":
          description: Cat claimed (or already this device's). The owner's view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "400":
          description: Invalid request, a pin that isn't a position, or an offensive note (code OFFENSIVE_NOTE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: NOT_MET, or the device secret was refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
        "409":
          description: ALREADY_HOMED or NOT_ON_STREET
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422":
          description: NOT_CONFIRMED or PIN_TOO_FAR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: CLAIM_LIMIT or CLAIM_COOLDOWN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /cats/{catId}/let-go:
    post:
      operationId: letGoCat
      tags: [cats]
      summary: The owner says the cat doesn't live with them any more (claiming-a-cat.md §6)
      description: |
        Needs the device secret, and only the cat's current owner may call
        it (403 NOT_OWNER otherwise). In one transaction the owner's own
        `homed` statements are withdrawn, so the cat's status falls back to
        what stood before the claim, and the owner link, name, home note and
        home pin are cleared. Tells nobody. The answer is the public view of
        the cat, and is never cached. The same phone can't claim this cat
        again for 7 days (429 CLAIM_COOLDOWN on the claim).
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatLetGo"
      responses:
        "200":
          description: Let go. The public view of the cat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: NOT_OWNER, or the device secret was refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
  /cats/{catId}/follow:
    post:
      operationId: followCat
      tags: [cats]
      summary: Follow a cat, so its updates reach this phone
      description: |
        Needs the device secret. Idempotent: following twice keeps one row.
        Clears any earlier unfollow, so a phone that spots the cat again is
        followed again only by choice. Never cached. A courtesy cap of 50
        follow or unfollow calls per phone per day (300 per address) answers 429.
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatFollow"
      responses:
        "200":
          description: The phone now follows the cat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Device secret missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: The device secret was refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "410":
          description: The device's data was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Too many follow or unfollow calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: The counter failed; try again shortly (Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /cats/{catId}/unfollow:
    post:
      operationId: unfollowCat
      tags: [cats]
      summary: Stop following a cat
      description: |
        Needs the device secret. Idempotent. Records the choice, so spotting
        the cat again does not follow it again. The cat's owner cannot
        unfollow (403 NOT_OWNER_CANNOT_UNFOLLOW). Never cached. Shares the
        courtesy cap with follow.
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatFollow"
      responses:
        "200":
          description: The phone no longer follows the cat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowState"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Device secret missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "403":
          description: NOT_OWNER_CANNOT_UNFOLLOW, or the device secret was refused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "410":
          description: The device's data was deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Too many follow or unfollow calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "503":
          description: The counter failed; try again shortly (Retry-After)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /cats/{catId}/updates:
    post:
      operationId: createCatUpdate
      tags: [notifications]
      summary: Owner-only — broadcast an update about a cat to its subscribers
      security:
        - ownerToken: []
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatUpdateRequest"
      responses:
        "201":
          description: Update created and fanned out to subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatUpdate"
        "401":
          description: Missing or invalid owner token
        "404":
          description: Cat not found
  /sightings:
    post:
      operationId: createSighting
      tags: [sightings]
      summary: Submit a cat photo and location; returns AI match candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSightingRequest"
      responses:
        "201":
          description: Sighting created with match candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          description: >-
            Invalid image (not JPEG/PNG, malformed base64, or over 5 MB
            decoded), or extra photos that break the rules (SYC-415). `photo`
            says which photo failed, when one did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSightingError"
        "413":
          description: The spot is too large to send. Remove a photo and try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /sightings/{sightingId}/recheck:
    post:
      operationId: recheckSighting
      tags: [sightings]
      summary: Run the look-alike check again after it failed (SYC-503)
      description: >-
        Only the sighting's own device, and only while it is unresolved.
        After a stored failure it runs the check again on the photos and
        location already saved, counted against the same limits as sending
        a spot. A check that worked is final: asking again returns that
        check's answer (from the stored record, with empty reasoning) and runs
        nothing, so a phone that never heard a successful recheck still gets
        the look-alikes. Answers exactly as sending a spot does.
      parameters:
        - name: sightingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecheckSightingRequest"
      responses:
        "200":
          description: The check ran again (it may have failed again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "403":
          description: Not this device's sighting
        "404":
          description: Sighting not found
        "409":
          description: >-
            Refused, with a code: RESOLVED (already resolved), CHECK_RUNNING
            (a check for it is running now; try again in a moment), or
            NOT_CHECKABLE (the failure was never recorded, so there is
            nothing to re-run)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "429":
          description: Too many checks; Retry-After says how long to wait
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /sightings/{sightingId}/resolve:
    post:
      operationId: resolveSighting
      tags: [sightings]
      summary: Confirm a match to an existing cat, or register a new named cat
      parameters:
        - name: sightingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSightingRequest"
      responses:
        "200":
          description: Sighting resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        "404":
          description: Sighting not found
        "409":
          description: >-
            Already resolved, or the new cat name is already taken (code
            NAME_TAKEN, with the public details of the cat that has the name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveConflictBody"
        "422":
          description: >-
            Hand pick refused (code NOT_NEARBY): the cat's published square is
            not within 1.5 km of the sighting's stored location, or the cat
            does not exist. Every refusal has the same status, code and
            message, whatever the reason (choose-a-different-cat.md §4.8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /sightings/{sightingId}/answers:
    post:
      operationId: answerSightingQuestions
      tags: [sightings]
      summary: Answer the optional questions asked after the points (ear tip, food and water, note)
      description: >-
        Data spine PR 7 (cat-record-data-spine.md §4.4, §7, §10.7; plan
        Conflicts C5) and SYC-117 part 2 (add-details-later.md). Sent from
        the reward screen after the points, or later from the cat's page.
        Accepted until 30 days after the photo was taken, from the
        sighting's own device (which must prove its secret). Each question
        is answered once per sighting: an already-answered question in the
        request is left out of `recorded`, and the rest are kept. Each answer is written as its
        own observation about the cat; the sightings row is never updated.
        Every field is optional; a request with none of them writes nothing.
        Each spotter answers the ear-tip question once per cat: an ear-tip
        answer from a device that has already given one for this cat is
        dropped (left out of `recorded`), and the other answers are kept.
        The note is seen only by the Syros Cats team and never appears in a
        public payload.
      parameters:
        - name: sightingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SightingAnswersRequest"
      responses:
        "200":
          description: Answers recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SightingAnswersResult"
        "400":
          description: Malformed answers
        "403":
          description: Not this device's sighting
        "404":
          description: Sighting not found
        "409":
          description: >-
            NOT_RESOLVED (the sighting has no cat yet), ALREADY_ANSWERED
            (nothing in the request could be recorded: every question in it
            was already answered), or EAR_TIP_CHECKED (a change was asked
            for, but Syros Cats have already checked this cat's ear tip or
            sterilisation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "422":
          description: ANSWERS_CLOSED (more than 30 days since the photo was taken)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /profiles/{deviceId}/cats/{catId}/open-sightings:
    get:
      operationId: getMyOpenSightings
      tags: [sightings]
      summary: This device's recent sightings of a cat that still have questions open
      description: >-
        SYC-117 part 2 (add-details-later.md §6). Feeds the "Anything to add?"
        card on a cat's page. Only the caller's own resolved sightings of
        this cat, taken in the last 30 days, with something still open. Needs
        the device's secret. Carries no coordinates and no note text.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Open sightings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOpenSightings"
        "401":
          description: Device secret required
        "403":
          description: Device secret does not match
  /cats/name-suggestions:
    post:
      operationId: suggestCatNames
      tags: [cats]
      summary: Generate fun, available cat name suggestions in the given language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestCatNamesRequest"
      responses:
        "200":
          description: Suggested names, none of which are already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestCatNamesResult"
        "502":
          description: Name generation failed
  /profiles/{deviceId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get (or lazily create) a device profile with points and badges
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update profile settings such as the leaderboard nickname
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid nickname
  /profiles/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [profiles]
      summary: Check whether a username is free (case-insensitive)
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
  /profiles/username-suggestions:
    get:
      operationId: getUsernameSuggestions
      tags: [profiles]
      summary: Fun cat-themed username ideas, excluding taken names
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameSuggestions"
  /profiles/{deviceId}/username:
    get:
      operationId: getClaimedUsername
      tags: [profiles]
      summary: Read the authenticated device's claimed username without loading profile statistics
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: Current username, or null before a claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedUsername"
    post:
      operationId: claimUsername
      tags: [profiles]
      summary: Claim a unique username for a device profile
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimUsernameRequest"
      responses:
        "200":
          description: Username claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedUsername"
        "400":
          description: Invalid or offensive username
        "409":
          description: Username already taken
  /notifications/{deviceId}:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a device, newest first
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppNotification"
  /notifications/{deviceId}/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications for a device as read
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
  /notifications/{deviceId}/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - $ref: "#/components/parameters/DeviceSecretHeader"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
  /profile/{deviceId}/push-token:
    put:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register or update the Expo push token for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /me:
    delete:
      operationId: deleteMyData
      tags: [profiles]
      summary: Delete everything that identifies this device's spotter (SYC-63)
      description: >-
        Removes the profile, points, follows, notifications and push token,
        and unlinks every sighting and note from the spotter, in one
        transaction. The cat records stay, credited to "a spotter". The
        device id travels in a header so it never lands in a request log.
        Running it again is safe and returns 204.
      parameters:
        - $ref: "#/components/parameters/DeviceIdHeader"
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "204":
          description: Deleted, or already deleted
        "400":
          description: Missing or invalid device id
        "401":
          description: Device secret missing
        "403":
          description: Device secret does not match; nothing was deleted
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [profiles]
      summary: Top spotters ranked by points
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /campaign:
    get:
      operationId: getCampaign
      tags: [campaign]
      summary: The colony fundraising campaign shown on the Help & info page
      responses:
        "200":
          description: Campaign configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /app-settings:
    get:
      operationId: getAppSettings
      tags: [campaign]
      summary: The match-wait switches (SYC-36 / SYC-48), the feeding nudge's donation link and hidden starter facts
      responses:
        "200":
          description: The switches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSettings"
  /app-settings/{deviceId}/signals:
    get:
      operationId: getSpotterSignals
      tags: [campaign]
      summary: Does this phone look like a resident's? (feeding-nudge.md §3.2)
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: The two signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpotterSignals"
  /go/feed:
    get:
      operationId: goFeed
      tags: [campaign]
      summary: "\"Help feed a cat\": counts the tap and forwards to the donation page. A browser link, not called by the client"
      responses:
        "302":
          description: Forwarded to the donation page
        "200":
          description: The donation link is switched off; a plain page saying so
  /go/give:
    get:
      operationId: goGive
      tags: [campaign]
      summary: "The Help & info page's give link: forwards to the donation page and counts nothing. A browser link, not called by the client"
      responses:
        "302":
          description: Forwarded to the donation page
        "200":
          description: The donation link is switched off; a plain page saying so
  /issues:
    post:
      operationId: reportIssue
      tags: [issues]
      summary: Report an issue with a cat or one of its photos (report-an-issue.md §5.1, §8, §9.5)
      description: |
        Public, no account. Needs the device secret (trust-on-first-use).
        `turnstileToken` is a Cloudflare Turnstile token for the action
        `report_issue` with `cdata` = `clientRef`.

        A resend of the same `clientRef` from the same device is one report:
        it gets the first answer again (200), with or without a token. A
        report saved without a verified token, still undecided and whose
        photo was never restored, is upgraded by a resend with a good token.

        For `photo_private` and `photo_inappropriate` the photo may be hidden
        from the public in the same moment. `hidden` says whether it is
        hidden now because of this report, or was already hidden. It is
        false when the token wasn't verified, the photo was restored by the
        team before, the day's limit on report-hides was reached, or this
        address's hide limit was reached. Choose the words shown from
        `hidden`, never from the reason.
      parameters:
        - $ref: "#/components/parameters/DeviceSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueReportRequest"
      responses:
        "200":
          description: Already sent (a resend); the first answer again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueReportReply"
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueReportReply"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
        "401":
          description: Device secret missing
        "403":
          description: Device secret refused
        "404":
          description: No such cat, or no such photo
        "410":
          description: This spotter's data was deleted
        "422":
          description: The photo isn't one of this cat's photos
        "428":
          description: challenge_required. Nothing was saved; run a fresh check and send again
        "429":
          description: Too many requests from this address. Keep the report and retry later
        "503":
          description: try_again or turnstile_not_configured. Nothing was saved; retry later (not a refusal)
components:
  parameters:
    DeviceIdHeader:
      name: X-Device-Id
      in: header
      required: true
      description: >-
        The device id, for the one route that takes it in a header rather
        than the path (DELETE /me), so it never appears in a request log.
      schema: { type: string }
    DeviceSecretHeader:
      name: X-Device-Secret
      in: header
      required: true
      description: >-
        Device-generated private secret proving ownership of the device id.
        Bound to the device id on first use; must match on later requests.
      schema: { type: string }
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: OWNER_SECRET bearer token for owner-only endpoints
  schemas:
    AppSettings:
      type: object
      required: [feedNudge, hiddenFacts]
      properties:
        feedNudge:
          description: Null when the donation link and figures are off
          nullable: true
          type: object
          required: [donateHost]
          properties:
            donateHost: { type: string }
        hiddenFacts:
          type: array
          items: { type: string }
        extraPhotos:
          type: boolean
          description: >-
            SYC-415: show the extra-photo boxes (face and body) on the New
            spot screen. Optional so older code that builds this object keeps
            working; missing means off.
    SpotterSignals:
      type: object
      required: [hasClaimedCat, firstSpotDate]
      properties:
        hasClaimedCat: { type: boolean }
        firstSpotDate:
          description: Athens calendar day (YYYY-MM-DD) this phone's first sighting arrived, or null
          type: string
          nullable: true
    RegisterPushTokenRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]
    CreateCatUpdateRequest:
      type: object
      properties:
        updateType:
          type: string
          enum: [desexed, adopted, general]
        message: { type: string }
      required: [updateType, message]
    CatUpdate:
      type: object
      properties:
        id: { type: integer }
        catId: { type: integer }
        updateType:
          type: string
          enum: [sighting, desexed, adopted, general]
        message: { type: string }
        createdAt: { type: string }
      required: [id, catId, updateType, message, createdAt]
    AppNotification:
      type: object
      properties:
        id: { type: integer }
        catId: { type: integer }
        catUpdateId: { type: integer }
        catName: { type: string }
        catPhotoUrl:
          type: string
          nullable: true
        updateType:
          type: string
          enum: [sighting, desexed, adopted, general]
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
      required:
        [
          id,
          catId,
          catUpdateId,
          catName,
          catPhotoUrl,
          updateType,
          message,
          read,
          createdAt,
        ]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        commit:
          type: string
          description: Short git commit the running server was built from, or "unknown" when the build couldn't read it (and in development).
        builtAt:
          type: string
          description: When the running server was built (ISO 8601), or "unknown".
        turnstile:
          type: object
          description: The Turnstile check on the public report forms (SYC-170). Never the key itself.
          properties:
            mode:
              type: string
              enum: ["off", "observe", "enforce"]
              description: The mode in force. Production is "enforce" unless the pre-launch gate is on.
            secret:
              type: string
              enum: ["configured", "not_configured"]
              description: Whether TURNSTILE_SECRET_KEY is set.
          required: [mode, secret]
      required: [status, commit, builtAt, turnstile]
    Cat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        photoUrl:
          type: string
          nullable: true
        lat:
          type: number
          description: Where this cat is. For "approximate", the centre of its cell, never a pin.
        lng:
          type: number
          description: See lat.
        locationPrecision:
          type: string
          enum: [exact, approximate]
          description: |
            "approximate" means lat/lng are the centre of a cell of
            locationCellM metres and must be drawn as that cell, never as a
            pin (cat-record-data-spine.md §10.7). "exact" only ever reaches
            a cat's own owner, on its detail page.
        locationCellM:
          type: integer
          nullable: true
          description: The cell's side in metres when approximate; null when exact.
        sightingsCount: { type: integer }
        lastSeenAt:
          type: string
          description: A Syros (Europe/Athens) calendar date (YYYY-MM-DD), never a time (§6.4.4).
        distanceKm:
          type: number
          nullable: true
          description: To the cat's published cell centre, rounded to 0.1 km (§6.4.2).
        discovererSpotterCode:
          type: string
          nullable: true
          description: Null once the discoverer has deleted their data; the app shows "a spotter"
        discovererNickname:
          type: string
          nullable: true
        discovererUsername:
          type: string
          nullable: true
        ownerName:
          type: ["string", "null"]
          description: Display name of the cat's owner. Only in the owner's own view; null for everyone else (claiming-a-cat.md D9).
        homeDescription:
          type: ["string", "null"]
          description: Where the cat lives, as described by its owner. Only in the owner's own view; null for everyone else (D9).
        homePin:
          type: object
          nullable: true
          description: Where the owner says the cat lives. Only in the owner's own view; null for everyone else (claiming-a-cat.md §5, D9).
          properties:
            lat: { type: number }
            lng: { type: number }
          required: [lat, lng]
        hasHome:
          type: boolean
          description: |
            Whether this cat has a home. Derived from lifeStatus === "homed"
            (cat-record-data-spine.md §10.7, data-spine.md plan PR 4) rather
            than a claim column directly, so a team correction is honoured
            and deleting an owner's device never silently unhomes a cat.
        lifeStatus:
          type: string
          enum: [street, homed, in_care, deceased]
          description: |
            The cat's resolved life status (§3). A live "deceased" status is
            cleared automatically the moment a later sighting resolves to
            this cat (§3.2) — the client never needs to handle that itself.
        notSeenSince:
          type: string
          nullable: true
          description: |
            A calendar date (YYYY-MM-DD, Syros (Europe/Athens) day — the same convention
            lastSeenAt's server-side computation uses), set only when this
            cat is presumed deceased (§3.4: no evidence of life for 36
            months) — never alongside lifeStatus: "deceased", and never
            shown as a headline or sent as a notification. The app reads it
            as "Not seen since {date}", in the same quiet place it would
            show "Last seen yesterday". Date-only, not a timestamp: a
            three-year-old "last seen" doesn't need time-of-day precision,
            and a bare date avoids a timezone round-trip when the client
            renders it. Deliberately plain `type: string` rather than
            `format: date` — this repo's orval config coerces a `date`
            format straight to a JS `Date` in the zod package
            (`override.zod.coerce.response`), which would desync from the
            plain `string` the react-query client keeps; a bare string
            keeps both generated packages agreeing on the wire type.
        sterilised:
          type: object
          description: Sterilised status (§4). See D4 in DECISIONS.md for why a confirmed negative is shown publicly. Since SYC-75 "likely" (a clipped ear tip has been seen) is shown publicly too, now that Syros Cats can correct a wrong one (Q2). A missing clip is never shown as "not sterilised".
          properties:
            value:
              type: boolean
              nullable: true
            confidence:
              type: string
              enum: [confirmed, likely, reported, unknown]
            clippedTipSightings:
              type: integer
              description: How many photo-backed clipped-tip sightings have been recorded (§4.3), whatever a later correction did to the level.
          required: [value, confidence, clippedTipSightings]
        coat:
          type: array
          description: |
            For older app versions, display only, worked out from coatColours
            and coatPattern (§6). Never filter on it.
          maxItems: 2
          items:
            type: string
            enum: [black, white, ginger, grey, tabby, tortoiseshell_or_calico, black_and_white]
        coatColours:
          type: array
          description: The cat's resolved coat colours (coat-colours-and-pattern.md §6), in display order; [] when not known. Only the value.
          items: { type: string, enum: [black, grey, brown, ginger, white] }
        coatPattern:
          type: string
          nullable: true
          enum: [plain, stripes, patches]
          description: The cat's resolved coat pattern (§6), or null when not known. Only the value.
        markings:
          type: array
          description: |
            The cat's resolved markings (coat-markings-and-health.md §3.2,
            §10.4), `[]` when none are known. Only the list: never how sure,
            who said it or how many people. Optional, as `coat`.
          items:
            type: string
            enum: [white_paws, white_chest, white_face, colourpoint, long_fur, kinked_tail, torn_ear, short_tail, missing_eye, three_legs, odd_eyes]
      required:
        [id, name, description, photoUrl, lat, lng, locationPrecision, locationCellM, sightingsCount, lastSeenAt, hasHome, lifeStatus, notSeenSince, sterilised]
    CatPage:
      type: object
      properties:
        cats:
          type: array
          items:
            $ref: "#/components/schemas/Cat"
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        nextPage:
          type: integer
          nullable: true
          description: The next page to ask for, or null on the last page.
      required: [cats, page, pageSize, total, nextPage]
    CatClaim:
      type: object
      description: |
        claiming-a-cat.md §5. livesOnSyros and livesInMyHome must both be
        true (the app always sends true). Either one missing or false is
        422 NOT_CONFIRMED, given only after the checks about the cat (§3
        order of checks). A value of the wrong type (the string "true",
        say), or a homePin that is missing, null or not a position, is a
        plain 400 before anything else.
      properties:
        deviceId: { type: string, minLength: 1 }
        livesOnSyros: { type: boolean }
        livesInMyHome: { type: boolean }
        homePin:
          type: object
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lng: { type: number, minimum: -180, maximum: 180 }
          required: [lat, lng]
        homeNote: { type: string, maxLength: 200 }
      required: [deviceId, homePin]
    IssueReportRequest:
      type: object
      description: report-an-issue.md §2, §13. The secret travels in X-Device-Secret.
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 128 }
        clientRef: { type: string, minLength: 8, maxLength: 100 }
        reason:
          type: string
          enum:
            - photo_private
            - photo_inappropriate
            - photo_not_cat
            - wrong_cat
            - wrong_name
            - wrong_info
            - location_revealing
            - cat_died
            - other
        catId: { type: integer }
        photoPublicId:
          type: string
          description: Required for photo_private, photo_inappropriate and photo_not_cat; optional for wrong_cat and other; not allowed otherwise.
        note: { type: string, maxLength: 1000 }
        language: { type: string, enum: [en, el, fr] }
        turnstileToken: { type: string, maxLength: 2048 }
      required: [deviceId, clientRef, reason, catId]
    IssueReportReply:
      type: object
      properties:
        publicId: { type: string }
        hidden: { type: boolean }
      required: [publicId, hidden]
    CatLetGo:
      type: object
      description: claiming-a-cat.md §6. Only the device id; the secret travels in X-Device-Secret.
      properties:
        deviceId: { type: string, minLength: 1 }
      required: [deviceId]
    CatFollow:
      type: object
      description: Only the device id; the secret travels in X-Device-Secret.
      properties:
        deviceId: { type: string, minLength: 1 }
      required: [deviceId]
    FollowState:
      type: object
      properties:
        isFollowing: { type: boolean }
        followersCount: { type: integer }
      required: [isFollowing, followersCount]
    CatOwnerUpdate:
      type: object
      properties:
        deviceId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        homeDescription: { type: string, maxLength: 200 }
      required: [deviceId]
    Sighting:
      type: object
      description: |
        A sighting in a cat's public history: photo, spotter and date. No
        position and no sighting id, which would give away upload order
        (cat-record-data-spine.md §6.4).
      properties:
        catId:
          type: integer
          nullable: true
        spotterCode:
          type: string
          nullable: true
          description: Null once the spotter has deleted their data; the app shows "a spotter"
        spotterUsername:
          type: string
          nullable: true
        spotterNickname:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        extraPhotos:
          type: array
          description: |
            SYC-415. The spot's photos other than the one in `photoUrl`, in the
            order taken. Left out entirely when a sighting has none. A photo the
            team hid has a null `photoUrl`.
          items:
            $ref: "#/components/schemas/SightingExtraPhoto"
        photoHidden:
          type: boolean
          description: |
            SYC-44 PR 6.1 (report-an-issue.md D4). True while this sighting's
            own photo is hidden from the public (then `photoUrl` is null), so
            the app shows "Photo hidden while Syros Cats take a look." in its
            place. It says only that a photo is hidden, never why or by whom.
        photoRemoved:
          type: boolean
          description: |
            SYC-462. Present, and true, only when this sighting's own photo was
            removed for good (it is hidden too, so `photoUrl` is null and
            `photoHidden` is true); the app then shows "Photo removed." Left
            out otherwise.
        createdAt:
          type: string
          description: A Syros (Europe/Athens) calendar date (YYYY-MM-DD). A public sighting never carries a position (§6.4.1).
      required: [spotterCode, photoUrl, photoHidden, createdAt]
    SightingExtraPhoto:
      type: object
      properties:
        role:
          type: string
          enum: [first, face, body]
        photoUrl:
          type: string
          nullable: true
      required: [role, photoUrl]
    CareEvent:
      type: object
      properties:
        type:
          type: string
          enum: [desexed, adopted, general, discovered]
          description: |
            Care events recorded against the cat. `discovered` is synthesised
            from the cat's own creation, and its `message` is the discoverer's
            display name rather than free text.
        message:
          type: string
          nullable: true
          description: >-
            Null only on a `discovered` event whose discoverer deleted their
            data (SYC-63, SYC-235). The app shows "a spotter" in the reader's
            language. A blank, never a stand-in word, so no username can be
            mistaken for it.
        at:
          type: string
          description: A Syros (Europe/Athens) calendar date (YYYY-MM-DD).
      required: [type, message, at]
    CatDetail:
      type: object
      properties:
        cat:
          $ref: "#/components/schemas/Cat"
        sightings:
          type: array
          items:
            $ref: "#/components/schemas/Sighting"
        fansCount:
          type: integer
          description: Distinct devices that have spotted this cat
        careTimeline:
          type: array
          description: Care history, newest first, oldest entry always `discovered`
          items:
            $ref: "#/components/schemas/CareEvent"
        canClaim:
          type: boolean
          description: |
            Whether the phone looking may say "This is my cat" (claiming-a-cat.md
            §4.1). True only when it sent X-Device-Id with its matching
            X-Device-Secret and passes the same check the claim uses; false
            otherwise, including for the cat's owner.
        claimCooldown:
          type: boolean
          description: |
            True only for a phone that proved who it is and let this cat go in
            the last 7 days, or was removed as its owner by the team in the
            last 30 (claiming-a-cat.md §11). Lets the app tell the
            cooldown from "this phone hasn't met the cat". False otherwise,
            for everyone else and for every phone that hasn't proved itself.
      required: [cat, sightings, fansCount, careTimeline, canClaim, claimCooldown]
    Campaign:
      type: object
      description: |
        Colony fundraising campaign shown on the Help & info page. Server-side config, so
        figures can be corrected without an app release. There is no payments
        backend: the app opens `donateUrl` externally and no money moves through
        this API.
      properties:
        id: { type: string }
        title: { type: string }
        blurb: { type: string }
        currency:
          type: string
          enum: [EUR]
        goalCents: { type: integer }
        raisedCents: { type: integer }
        catsHelped: { type: integer }
        donors: { type: integer }
        endsAt: { type: string }
        donateUrl:
          type: string
          description: Empty when no donation page is configured; the client hides the CTA
        suggestedAmountsCents:
          type: array
          items: { type: integer }
      required:
        [
          id,
          title,
          blurb,
          currency,
          goalCents,
          raisedCents,
          catsHelped,
          donors,
          endsAt,
          donateUrl,
          suggestedAmountsCents,
        ]
    CreateSightingRequest:
      type: object
      properties:
        deviceId: { type: string }
        photoBase64:
          type: string
          description: JPEG or PNG image as base64 (no data URI prefix), max 5 MB decoded
        lat: { type: number }
        lng: { type: number }
        capturedAt:
          type: string
          nullable: true
          description: >-
            ISO timestamp of when the photo was taken, for sightings queued
            offline and synced later. Omit for an immediate submission. The
            server clamps this (not in the future, at most 30 days old) before
            storing, since it is client-supplied and feeds streak day buckets.
        extraPhotos:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/ExtraPhoto"
          description: >-
            Up to two extra photos of the same cat from the same visit
            (SYC-415). At most one face and one body. The first photo stays in
            photoBase64.
      required: [deviceId, photoBase64, lat, lng]
    ExtraPhoto:
      type: object
      properties:
        role:
          type: string
          enum: [face, body]
        photoBase64:
          type: string
          description: JPEG or PNG as base64, prepared on the phone to at most 2048px.
      required: [role, photoBase64]
    CreateSightingError:
      type: object
      properties:
        error: { type: string }
        photo:
          type: string
          enum: [first, face, body]
          description: Which of the spot's photos failed, when one did (SYC-415).
      required: [error]
    MatchCandidate:
      type: object
      properties:
        catId: { type: integer }
        name: { type: string }
        photoUrl:
          type: string
          nullable: true
        confidence:
          type: number
          description: Match likelihood 0-1
        reasoning: { type: string }
      required: [catId, name, photoUrl, confidence, reasoning]
    MatchResult:
      type: object
      properties:
        sightingId: { type: integer }
        isCatPhoto:
          type: boolean
          description: False when the AI could not find a cat in the photo
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchCandidate"
          description: >-
            Candidates below the matcher's confidence threshold are omitted
            entirely — not included with blank or null fields. A weak match
            never names a cat, not even via an anonymous placeholder entry.
        matchCheck:
          type: string
          enum: [done, failed]
          description: >-
            SYC-503: whether the look-alike check worked. Read this FIRST: on
            "failed", candidates is empty and isCatPhoto is true only because
            nothing is known, never "no look-alikes" or "a cat". A stored
            answer without this field is read as "done".
        canRecheck:
          type: boolean
          description: >-
            SYC-503: true when a failed check can be run again with
            recheckSighting; false when the check worked, or when the photo
            has gone and there is nothing to check.
      required: [sightingId, isCatPhoto, candidates, matchCheck, canRecheck]
    RecheckSightingRequest:
      type: object
      properties:
        deviceId:
          type: string
          minLength: 1
          description: Device credential of the sighting owner; must match the sighting
      required: [deviceId]
    ResolveSightingRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Device credential of the sighting owner; must match the sighting
        catId:
          type: integer
          nullable: true
          description: Existing cat to confirm as the match
        newCatName:
          type: string
          nullable: true
          description: Name for a new unique cat (when no match)
        pickedFrom:
          type: string
          enum: [nearby, search, name_prompt, cat_page]
          description: >-
            Which screen a pick came from. It only describes the phone's
            own screen: the server never uses it to decide whether a choice
            was a suggestion (choose-a-different-cat.md §4.6). nearby, search
            and name_prompt are recorded on hand picks only; cat_page (the
            cat page's "I've spotted" question) is recorded on suggested
            picks too.
        openedPicker:
          type: boolean
          description: >-
            With newCatName: the spotter opened "Find the cat yourself"
            before choosing a new cat. Weak evidence the cat really is new;
            recorded for the team only (choose-a-different-cat.md §4.6).
        colourFilterOn:
          type: boolean
          description: >-
            From "Find the cat yourself": a chip was picked in either the
            colour or the pattern row when the choice was made. Recorded for
            the team only, as sighting_matches.colour_filter_on
            (coat-colours-and-pattern.md §5).
      required: [deviceId]
    ApiErrorBody:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable error code (e.g. NAME_TAKEN)
      required: [error]
    NameTakenCat:
      type: object
      description: The cat that already has the name. Public details only.
      properties:
        id: { type: integer }
        name: { type: string }
        photoUrl:
          type: string
          nullable: true
      required: [id, name, photoUrl]
    ResolveConflictBody:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable error code (e.g. NAME_TAKEN)
        cat:
          $ref: "#/components/schemas/NameTakenCat"
      required: [error]
    SuggestCatNamesRequest:
      type: object
      properties:
        language:
          type: string
          enum: [en, el, fr]
          description: Language for the generated names
        excludeNames:
          type: array
          maxItems: 100
          description: Names already shown in this naming session
          items:
            type: string
            minLength: 1
            maxLength: 40
      required: [language]
    SuggestCatNamesResult:
      type: object
      properties:
        suggestions:
          type: array
          items: { type: string }
      required: [suggestions]
    ResolveResult:
      type: object
      properties:
        cat:
          $ref: "#/components/schemas/Cat"
        pointsAwarded: { type: integer }
        isNewCat: { type: boolean }
        newBadges:
          type: array
          items: { type: string }
        profile:
          $ref: "#/components/schemas/Profile"
        askEarTip:
          type: boolean
          description: >-
            Whether to ask this spotter the ear-tip question about this cat.
            False once this device has given any ear-tip answer for this cat
            ("clipped", "looks whole" or "can't tell"), so each spotter is
            asked once per cat (data spine plan, decision Q3 → B).
      required: [cat, pointsAwarded, isNewCat, newBadges, profile, askEarTip]
    SightingAnswersRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Device credential of the sighting owner; must match the sighting
        earTip:
          type: string
          enum: [clipped_left, clipped_right, clipped_unsure, looks_whole, cant_tell]
          description: >-
            Is the ear tip clipped? "clipped_unsure" means clipped, but the
            spotter isn't sure which ear. Omit to skip.
        foodAndWater:
          type: string
          enum: ["yes", "no", cant_tell]
          description: Do they have food and water? Omit to skip.
        note:
          type: string
          maxLength: 500
          description: >-
            "Anything you noticed?" Seen only by the Syros Cats team, never
            published. Blank is treated as skipped.
        changeEarTip:
          type: boolean
          description: >-
            With earTip: replace this device's own current ear-tip answer for
            this cat (from the cat's page). The old answer is kept, marked
            replaced. Refused with EAR_TIP_CHECKED once Syros Cats have
            checked it. Without this, a second ear-tip answer is left out.
      required: [deviceId]
    MyOpenSightings:
      type: object
      properties:
        earTip:
          type: object
          description: >-
            This device's ear-tip answer for this cat. "open": not answered
            yet. "answered": `current` is the answer, and it can be changed.
            "checked": Syros Cats have checked it; it can't be changed.
          properties:
            state:
              type: string
              enum: [open, answered, checked]
            current:
              type: string
              enum: [clipped_left, clipped_right, clipped_unsure, looks_whole, cant_tell]
          required: [state]
        sightings:
          type: array
          items:
            $ref: "#/components/schemas/OpenSighting"
      required: [earTip, sightings]
    OpenSighting:
      type: object
      properties:
        sightingId: { type: integer }
        takenAt: { type: string, format: date-time }
        photoUrl:
          type: string
          nullable: true
        open:
          type: object
          properties:
            foodAndWater: { type: boolean }
            note: { type: boolean }
          required: [foodAndWater, note]
      required: [sightingId, takenAt, photoUrl, open]
    SightingAnswersResult:
      type: object
      properties:
        recorded:
          type: array
          description: Which answers were written (empty if everything was skipped)
          items:
            type: string
            enum: [ear_tip, food_and_water, note]
      required: [recorded]
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          maxLength: 24
          description: Display name for the leaderboard; empty or null clears it
    UsernameAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason:
          type: string
          nullable: true
          description: Why the name is unavailable ("taken", "invalid" or "offensive")
      required: [available]
    UsernameSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items: { type: string }
      required: [suggestions]
    ClaimUsernameRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
      required: [username]
    ClaimedUsername:
      type: object
      properties:
        username: { type: ["string", "null"] }
      required: [username]
    Profile:
      type: object
      properties:
        deviceId: { type: string }
        spotterCode: { type: string }
        username:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        points: { type: integer }
        totalSightings: { type: integer }
        uniqueCatsDiscovered: { type: integer }
        catsSpotted: { type: integer }
        badges:
          type: array
          items: { type: string }
        ownedCatIds:
          type: array
          items: { type: integer }
          description: >-
            Ids of cats this device owns. Only returned on the device's own
            profile route (the deviceId path param is the credential); never
            exposed in public payloads.
        currentStreakDays:
          type: integer
          description: >-
            Consecutive days (Europe/Athens) with at least one resolved
            sighting. Survives a day not yet spotted; breaks after a full
            missed day.
        spottedCatIds:
          type: array
          items: { type: integer }
          description: >-
            Ids of cats this device has personally spotted, driving the
            collected-vs-locked treatment on the cat grids. Same privacy
            reasoning as ownedCatIds.
        totalCats:
          type: integer
          description: Size of the whole cat-alog — the denominator in "12 of 142".
      required:
        [
          deviceId,
          spotterCode,
          points,
          totalSightings,
          uniqueCatsDiscovered,
          catsSpotted,
          badges,
          ownedCatIds,
          currentStreakDays,
          spottedCatIds,
          totalCats,
        ]
    LeaderboardEntry:
      type: object
      properties:
        spotterCode:
          type: string
          description: Opaque public spotter identifier (never the raw device id)
        username:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        points: { type: integer }
        uniqueCatsDiscovered: { type: integer }
        rank: { type: integer }
      required: [spotterCode, points, uniqueCatsDiscovered, rank]

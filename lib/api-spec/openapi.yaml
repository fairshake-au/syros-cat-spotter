openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Syros Cat Spotter API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cats
    description: Cat catalog
  - name: sightings
    description: Cat sightings and matching
  - name: profiles
    description: Device profiles, points, badges
  - name: notifications
    description: Cat update notifications and push tokens
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /cats:
    post:
      operationId: registerCat
      tags: [cats]
      summary: Register a brand-new owned cat (resident registration, no sighting required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatRegistration"
      responses:
        "201":
          description: Cat created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "400":
          description: Invalid input
    get:
      operationId: listCats
      tags: [cats]
      summary: List all cats in the catalog
      parameters:
        - name: lat
          in: query
          required: false
          schema: { type: number }
        - name: lng
          in: query
          required: false
          schema: { type: number }
      responses:
        "200":
          description: Cats, sorted by distance when lat/lng provided
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cat"
  /cats/{catId}:
    get:
      operationId: getCat
      tags: [cats]
      summary: Get a cat with its sighting history
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Cat detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatDetail"
        "404":
          description: Not found
    patch:
      operationId: updateCat
      tags: [cats]
      summary: Rename a cat or update its home description (owner only)
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatOwnerUpdate"
      responses:
        "200":
          description: Updated cat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "403":
          description: Device is not the owner of this cat
        "404":
          description: Not found
  /cats/{catId}/claim:
    post:
      operationId: claimCat
      tags: [cats]
      summary: Claim an unclaimed cat as its owner (idempotent for the same device)
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatClaim"
      responses:
        "200":
          description: Cat claimed (or already claimed by this device)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cat"
        "404":
          description: Not found
        "409":
          description: Cat already claimed by a different device
  /cats/{catId}/updates:
    post:
      operationId: createCatUpdate
      tags: [notifications]
      summary: Owner-only — broadcast an update about a cat to its subscribers
      security:
        - ownerToken: []
      parameters:
        - name: catId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatUpdateRequest"
      responses:
        "201":
          description: Update created and fanned out to subscribers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatUpdate"
        "401":
          description: Missing or invalid owner token
        "404":
          description: Cat not found
  /sightings:
    post:
      operationId: createSighting
      tags: [sightings]
      summary: Submit a cat photo and location; returns AI match candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSightingRequest"
      responses:
        "201":
          description: Sighting created with match candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResult"
        "400":
          description: Invalid image (not JPEG/PNG, malformed base64, or over 5 MB decoded)
  /sightings/{sightingId}/resolve:
    post:
      operationId: resolveSighting
      tags: [sightings]
      summary: Confirm a match to an existing cat, or register a new named cat
      parameters:
        - name: sightingId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveSightingRequest"
      responses:
        "200":
          description: Sighting resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveResult"
        "404":
          description: Sighting not found
        "409":
          description: >-
            Already resolved, or the new cat name is already taken (code
            NAME_TAKEN, with the public details of the cat that has the name)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveConflictBody"
        "422":
          description: >-
            Hand pick refused (code NOT_NEARBY): the cat's published square is
            not within 1.5 km of the sighting's stored location, or the cat
            does not exist. Every refusal has the same status, code and
            message, whatever the reason (choose-a-different-cat.md §4.8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorBody"
  /cats/name-suggestions:
    post:
      operationId: suggestCatNames
      tags: [cats]
      summary: Generate fun, available cat name suggestions in the given language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestCatNamesRequest"
      responses:
        "200":
          description: Suggested names, none of which are already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestCatNamesResult"
        "502":
          description: Name generation failed
  /profiles/{deviceId}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get (or lazily create) a device profile with points and badges
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [profiles]
      summary: Update profile settings such as the leaderboard nickname
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid nickname
  /profiles/username-availability:
    get:
      operationId: checkUsernameAvailability
      tags: [profiles]
      summary: Check whether a username is free (case-insensitive)
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameAvailability"
  /profiles/username-suggestions:
    get:
      operationId: getUsernameSuggestions
      tags: [profiles]
      summary: Fun cat-themed username ideas, excluding taken names
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsernameSuggestions"
  /profiles/{deviceId}/username:
    get:
      operationId: getClaimedUsername
      tags: [profiles]
      summary: Read the authenticated device's claimed username without loading profile statistics
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: Current username, or null before a claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedUsername"
    post:
      operationId: claimUsername
      tags: [profiles]
      summary: Claim a unique username for a device profile
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimUsernameRequest"
      responses:
        "200":
          description: Username claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimedUsername"
        "400":
          description: Invalid or offensive username
        "409":
          description: Username already taken
  /notifications/{deviceId}:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for a device, newest first
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppNotification"
  /notifications/{deviceId}/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications for a device as read
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
  /notifications/{deviceId}/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a single notification as read
      parameters:
        - $ref: "#/components/parameters/DeviceSecretHeader"
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                required: [updated]
  /profile/{deviceId}/push-token:
    put:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register or update the Expo push token for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/DeviceSecretHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                required: [ok]
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [profiles]
      summary: Top spotters ranked by points
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /campaign:
    get:
      operationId: getCampaign
      tags: [campaign]
      summary: The colony fundraising campaign shown on the Help tab
      responses:
        "200":
          description: Campaign configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
components:
  parameters:
    DeviceSecretHeader:
      name: X-Device-Secret
      in: header
      required: true
      description: >-
        Device-generated private secret proving ownership of the device id.
        Bound to the device id on first use; must match on later requests.
      schema: { type: string }
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: OWNER_SECRET bearer token for owner-only endpoints
  schemas:
    RegisterPushTokenRequest:
      type: object
      properties:
        token: { type: string }
      required: [token]
    CreateCatUpdateRequest:
      type: object
      properties:
        updateType:
          type: string
          enum: [desexed, adopted, general]
        message: { type: string }
      required: [updateType, message]
    CatUpdate:
      type: object
      properties:
        id: { type: integer }
        catId: { type: integer }
        updateType:
          type: string
          enum: [sighting, desexed, adopted, general]
        message: { type: string }
        createdAt: { type: string }
      required: [id, catId, updateType, message, createdAt]
    AppNotification:
      type: object
      properties:
        id: { type: integer }
        catId: { type: integer }
        catUpdateId: { type: integer }
        catName: { type: string }
        catPhotoUrl:
          type: string
          nullable: true
        updateType:
          type: string
          enum: [sighting, desexed, adopted, general]
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string }
      required:
        [
          id,
          catId,
          catUpdateId,
          catName,
          catPhotoUrl,
          updateType,
          message,
          read,
          createdAt,
        ]
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Cat:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        photoUrl:
          type: string
          nullable: true
        lat: { type: number }
        lng: { type: number }
        sightingsCount: { type: integer }
        lastSeenAt: { type: string }
        distanceKm:
          type: number
          nullable: true
        discovererSpotterCode: { type: string }
        discovererNickname:
          type: string
          nullable: true
        discovererUsername:
          type: string
          nullable: true
        ownerName:
          type: ["string", "null"]
          description: Display name of the resident who claimed this cat
        homeDescription:
          type: ["string", "null"]
          description: Where the cat lives, as described by its owner
        hasHome:
          type: boolean
          description: Whether a resident has claimed this cat as having a home
      required:
        [id, name, description, photoUrl, lat, lng, sightingsCount, lastSeenAt, hasHome]
    CatRegistration:
      type: object
      properties:
        deviceId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        ownerName: { type: string, minLength: 1, maxLength: 60 }
        homeDescription: { type: string, maxLength: 200 }
        lat: { type: number }
        lng: { type: number }
      required: [deviceId, name, ownerName, homeDescription, lat, lng]
    CatClaim:
      type: object
      properties:
        deviceId: { type: string, minLength: 1 }
        homeDescription: { type: string, maxLength: 200 }
      required: [deviceId, homeDescription]
    CatOwnerUpdate:
      type: object
      properties:
        deviceId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1, maxLength: 60 }
        homeDescription: { type: string, maxLength: 200 }
      required: [deviceId]
    Sighting:
      type: object
      properties:
        id: { type: integer }
        catId:
          type: integer
          nullable: true
        spotterCode: { type: string }
        spotterUsername:
          type: string
          nullable: true
        spotterNickname:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        lat: { type: number }
        lng: { type: number }
        createdAt: { type: string }
      required: [id, spotterCode, photoUrl, lat, lng, createdAt]
    CareEvent:
      type: object
      properties:
        type:
          type: string
          enum: [desexed, adopted, general, discovered]
          description: |
            Care events recorded against the cat. `discovered` is synthesised
            from the cat's own creation, and its `message` is the discoverer's
            display name rather than free text.
        message: { type: string }
        at: { type: string }
      required: [type, message, at]
    CatDetail:
      type: object
      properties:
        cat:
          $ref: "#/components/schemas/Cat"
        sightings:
          type: array
          items:
            $ref: "#/components/schemas/Sighting"
        fansCount:
          type: integer
          description: Distinct devices that have spotted this cat
        careTimeline:
          type: array
          description: Care history, newest first, oldest entry always `discovered`
          items:
            $ref: "#/components/schemas/CareEvent"
      required: [cat, sightings, fansCount, careTimeline]
    Campaign:
      type: object
      description: |
        Colony fundraising campaign shown on the Help tab. Server-side config, so
        figures can be corrected without an app release. There is no payments
        backend: the app opens `donateUrl` externally and no money moves through
        this API.
      properties:
        id: { type: string }
        title: { type: string }
        blurb: { type: string }
        currency:
          type: string
          enum: [EUR]
        goalCents: { type: integer }
        raisedCents: { type: integer }
        catsHelped: { type: integer }
        donors: { type: integer }
        endsAt: { type: string }
        donateUrl:
          type: string
          description: Empty when no donation page is configured; the client hides the CTA
        suggestedAmountsCents:
          type: array
          items: { type: integer }
      required:
        [
          id,
          title,
          blurb,
          currency,
          goalCents,
          raisedCents,
          catsHelped,
          donors,
          endsAt,
          donateUrl,
          suggestedAmountsCents,
        ]
    CreateSightingRequest:
      type: object
      properties:
        deviceId: { type: string }
        photoBase64:
          type: string
          description: JPEG or PNG image as base64 (no data URI prefix), max 5 MB decoded
        lat: { type: number }
        lng: { type: number }
        capturedAt:
          type: string
          nullable: true
          description: >-
            ISO timestamp of when the photo was taken, for sightings queued
            offline and synced later. Omit for an immediate submission. The
            server clamps this (not in the future, at most 30 days old) before
            storing, since it is client-supplied and feeds streak day buckets.
      required: [deviceId, photoBase64, lat, lng]
    MatchCandidate:
      type: object
      properties:
        catId: { type: integer }
        name: { type: string }
        photoUrl:
          type: string
          nullable: true
        confidence:
          type: number
          description: Match likelihood 0-1
        reasoning: { type: string }
      required: [catId, name, photoUrl, confidence, reasoning]
    MatchResult:
      type: object
      properties:
        sightingId: { type: integer }
        isCatPhoto:
          type: boolean
          description: False when the AI could not find a cat in the photo
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchCandidate"
          description: >-
            Candidates below the matcher's confidence threshold are omitted
            entirely — not included with blank or null fields. A weak match
            never names a cat, not even via an anonymous placeholder entry.
      required: [sightingId, isCatPhoto, candidates]
    ResolveSightingRequest:
      type: object
      properties:
        deviceId:
          type: string
          description: Device credential of the sighting owner; must match the sighting
        catId:
          type: integer
          nullable: true
          description: Existing cat to confirm as the match
        newCatName:
          type: string
          nullable: true
          description: Name for a new unique cat (when no match)
        pickedFrom:
          type: string
          enum: [nearby, search, name_prompt]
          description: >-
            Which screen a hand pick came from. It only describes the phone's
            own screen: the server never uses it to decide whether a choice
            was a suggestion (choose-a-different-cat.md §4.6).
        openedPicker:
          type: boolean
          description: >-
            With newCatName: the spotter opened "Find the cat yourself"
            before choosing a new cat. Weak evidence the cat really is new;
            recorded for the team only (choose-a-different-cat.md §4.6).
      required: [deviceId]
    ApiErrorBody:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable error code (e.g. NAME_TAKEN)
      required: [error]
    NameTakenCat:
      type: object
      description: The cat that already has the name. Public details only.
      properties:
        id: { type: integer }
        name: { type: string }
        photoUrl:
          type: string
          nullable: true
      required: [id, name, photoUrl]
    ResolveConflictBody:
      type: object
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable error code (e.g. NAME_TAKEN)
        cat:
          $ref: "#/components/schemas/NameTakenCat"
      required: [error]
    SuggestCatNamesRequest:
      type: object
      properties:
        language:
          type: string
          enum: [en, el, fr]
          description: Language for the generated names
        excludeNames:
          type: array
          maxItems: 100
          description: Names already shown in this naming session
          items:
            type: string
            minLength: 1
            maxLength: 40
      required: [language]
    SuggestCatNamesResult:
      type: object
      properties:
        suggestions:
          type: array
          items: { type: string }
      required: [suggestions]
    ResolveResult:
      type: object
      properties:
        cat:
          $ref: "#/components/schemas/Cat"
        pointsAwarded: { type: integer }
        isNewCat: { type: boolean }
        newBadges:
          type: array
          items: { type: string }
        profile:
          $ref: "#/components/schemas/Profile"
      required: [cat, pointsAwarded, isNewCat, newBadges, profile]
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          nullable: true
          maxLength: 24
          description: Display name for the leaderboard; empty or null clears it
    UsernameAvailability:
      type: object
      properties:
        available: { type: boolean }
        reason:
          type: string
          nullable: true
          description: Why the name is unavailable ("taken", "invalid" or "offensive")
      required: [available]
    UsernameSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items: { type: string }
      required: [suggestions]
    ClaimUsernameRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 24
      required: [username]
    ClaimedUsername:
      type: object
      properties:
        username: { type: ["string", "null"] }
      required: [username]
    Profile:
      type: object
      properties:
        deviceId: { type: string }
        spotterCode: { type: string }
        username:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        points: { type: integer }
        totalSightings: { type: integer }
        uniqueCatsDiscovered: { type: integer }
        catsSpotted: { type: integer }
        badges:
          type: array
          items: { type: string }
        ownedCatIds:
          type: array
          items: { type: integer }
          description: >-
            Ids of cats this device owns. Only returned on the device's own
            profile route (the deviceId path param is the credential); never
            exposed in public payloads.
        currentStreakDays:
          type: integer
          description: >-
            Consecutive days (Europe/Athens) with at least one resolved
            sighting. Survives a day not yet spotted; breaks after a full
            missed day.
        spottedCatIds:
          type: array
          items: { type: integer }
          description: >-
            Ids of cats this device has personally spotted, driving the
            collected-vs-locked treatment on the cat grids. Same privacy
            reasoning as ownedCatIds.
        totalCats:
          type: integer
          description: Size of the whole cat-alog — the denominator in "12 of 142".
      required:
        [
          deviceId,
          spotterCode,
          points,
          totalSightings,
          uniqueCatsDiscovered,
          catsSpotted,
          badges,
          ownedCatIds,
          currentStreakDays,
          spottedCatIds,
          totalCats,
        ]
    LeaderboardEntry:
      type: object
      properties:
        spotterCode:
          type: string
          description: Opaque public spotter identifier (never the raw device id)
        username:
          type: string
          nullable: true
        nickname:
          type: string
          nullable: true
        points: { type: integer }
        uniqueCatsDiscovered: { type: integer }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 48 35" aria-hidden="true">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Moving parts: legs-a, legs-b: skewX -14..14deg about 24,24, 0.5s, in opposite phase | cat: translateY 0..-1, 0.25s
     Keep: the viewBox, every id listed under Moving parts, and each pivot (the app moves these parts by id).
     Free to change: shapes, colours, details. Allowed: g, path, ellipse, circle, rect, polygon, line; flat fills only.
     Not allowed: text, gradients, filters, masks, clip paths, images. Outline #3b3934. -->
<style>#legs-a{transform-origin:24px 24px;animation:step .5s ease-in-out infinite alternate}#legs-b{transform-origin:24px 24px;animation:step .5s ease-in-out infinite alternate-reverse}@keyframes step{from{transform:skewX(-14deg)}to{transform:skewX(14deg)}}#cat{animation:bob .25s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g id="cat" stroke="#3b3934" stroke-width="1.2" stroke-linejoin="round" fill="#8d929a"><g id="legs-a"><rect x="12" y="20" width="4" height="9" rx="2"/><rect x="30" y="20" width="4" height="9" rx="2"/></g><g id="legs-b"><rect x="16" y="20" width="4" height="9" rx="2"/><rect x="34" y="20" width="4" height="9" rx="2"/></g><path id="tail" d="M10 16 Q2 12 4 4" fill="none" stroke-width="3" stroke-linecap="round" stroke="#8d929a"/><ellipse cx="24" cy="17" rx="15" ry="7"/><polygon points="36,7 37,0 41,5"/><polygon points="42,6 45,0 46,8"/><circle cx="40" cy="11" r="7"/><circle id="eye" cx="42" cy="10" r="1.2" fill="#1d1d1d" stroke="none"/></g>
</svg>

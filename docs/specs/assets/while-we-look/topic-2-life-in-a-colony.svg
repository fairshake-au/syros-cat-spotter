<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="A grey cat and a ginger kitten sitting together">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Motion: the two cats nod in turn (translateY, 2.8s, half a cycle apart)
     Keep: the viewBox, every id, and each transform-origin (the app animates these parts by id).
     Free to change: shapes, colours, details. Keep it flat (no gradients), outline #3b3934. -->
<style>#mother-wrap{animation:nod 2.8s ease-in-out infinite}#kitten-wrap{animation:nod 2.8s ease-in-out infinite;animation-delay:-1.4s}@keyframes nod{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g id="mother-wrap"><g id="mother" transform="translate(-16 10) scale(0.9)"><path id="mother-tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#8d929a" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="mother-body" fill="#8d929a"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g fill="#fbfaf6"><ellipse cx="80" cy="100" rx="15" ry="22"/><ellipse cx="67" cy="146" rx="9" ry="6"/><ellipse cx="93" cy="146" rx="9" ry="6"/></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="mother-head" fill="#8d929a"><polygon id="mother-ear-left" points="57,46 59,17 78,34"/><polygon id="mother-ear-right" points="103,46 101,17 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="mother-eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="mother-nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/></g></g><g id="kitten-wrap"><g id="kitten" transform="translate(80 72) scale(0.5)"><path id="kitten-tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#e38b3a" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="kitten-body" fill="#e38b3a"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="kitten-head" fill="#e38b3a"><polygon id="kitten-ear-left" points="57,46 59,17 78,34"/><polygon id="kitten-ear-right" points="103,46 101,17 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="kitten-eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="kitten-nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/></g></g>
</svg>

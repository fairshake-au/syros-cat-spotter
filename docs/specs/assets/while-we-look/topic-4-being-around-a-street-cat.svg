<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" aria-hidden="true">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Moving parts: tail: rotate -4..5deg about 112,132, 3.2s loop | ripple: scale 0.4..1.2 and opacity 0.9..0 about 26,141, 2s loop
     Keep: the viewBox, every id listed under Moving parts, and each pivot (the app moves these parts by id).
     Free to change: shapes, colours, details. Allowed: g, path, ellipse, circle, rect, polygon, line; flat fills only.
     Not allowed: text, gradients, filters, masks, clip paths, images. Outline #3b3934. -->
<style>#tail{transform-origin:112px 132px;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}#ripple{transform-origin:26px 141px;animation:rip 2s ease-out infinite}@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.2);opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path id="tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#e38b3a" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="body" fill="#e38b3a"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g fill="#fbfaf6"><ellipse cx="80" cy="100" rx="15" ry="22"/><ellipse cx="67" cy="146" rx="9" ry="6"/><ellipse cx="93" cy="146" rx="9" ry="6"/></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="head" fill="#e38b3a"><polygon id="ear-left" points="57,46 59,17 78,34"/><polygon id="ear-right" points="103,46 101,17 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/><path id="bowl" d="M6 140 L46 140 L41 154 L11 154 Z" fill="#1c77c3" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><ellipse cx="26" cy="141" rx="18" ry="3" fill="#8fc6ee"/><ellipse id="ripple" cx="26" cy="141" rx="10" ry="2" fill="none" stroke="#ffffff" stroke-width="1.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" aria-hidden="true">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Moving parts: aid: scale 1..1.12 about 132,40, 1.8s loop | ear-left: rotate 0..-10deg about 62,40, a twitch every 3s (the viewer's left ear)
     Keep: the viewBox, every id listed under Moving parts, and each pivot (the app moves these parts by id).
     Free to change: shapes, colours, details. Allowed: g, path, ellipse, circle, rect, polygon, line; flat fills only.
     Not allowed: text, gradients, filters, masks, clip paths, images. Outline #3b3934. -->
<style>#aid{transform-origin:132px 40px;animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}#ear-left{transform-origin:62px 40px;animation:twitch 3s infinite}@keyframes twitch{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-10deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path id="tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#8d929a" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="body" fill="#8d929a"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="head" fill="#8d929a"><polygon id="ear-left" points="57,46 59,17 78,34"/><polygon id="ear-right" points="103,46 101,17 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#2b2b2b" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/><g id="bandage"><rect x="86" y="128" width="14" height="14" fill="#fbfaf6" stroke="#3b3934" stroke-width="1.5"/><path d="M86 133 L100 133 M86 138 L100 138" stroke="#d9cfc0" stroke-width="1.5"/></g><g id="aid"><circle cx="132" cy="40" r="13" fill="#fbfaf6" stroke="#d64185" stroke-width="2"/><path d="M132 33 L132 47 M125 40 L139 40" stroke="#d64185" stroke-width="4" stroke-linecap="round"/></g>
</svg>

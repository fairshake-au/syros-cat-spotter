<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="A black cat peering through a magnifying glass">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Motion: the magnifying glass glides side to side in front of the face (translateX, 3s)
     Keep: the viewBox, every id, and each transform-origin (the app animates these parts by id).
     Free to change: shapes, colours, details. Keep it flat (no gradients), outline #3b3934. -->
<style>#lens{animation:scan 3s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-6px)}50%{transform:translateX(8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path id="tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#2b2b2b" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="body" fill="#2b2b2b"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="head" fill="#2b2b2b"><polygon id="ear-left" points="57,46 59,17 78,34"/><polygon id="ear-right" points="103,46 101,17 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#888" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#888" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/><g id="lens"><line x1="104" y1="74" x2="124" y2="98" stroke="#8b5a2b" stroke-width="6" stroke-linecap="round"/><circle cx="92" cy="58" r="17" fill="#e8f4fc" fill-opacity=".3" stroke="#3b3934" stroke-width="3"/></g>
</svg>

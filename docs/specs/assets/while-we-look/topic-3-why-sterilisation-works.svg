<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="A black and white cat with a clipped ear tip, a small heart rising">
<!-- Cat Spotters, While we look (SYC-772). First draft for refinement.
     Motion: a heart rises from beside the clipped ear and fades (3s loop); eyes blink
     Keep: the viewBox, every id, and each transform-origin (the app animates these parts by id).
     Free to change: shapes, colours, details. Keep it flat (no gradients), outline #3b3934. -->
<style>#heart{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:0}20%{opacity:1}100%{transform:translateY(-18px);opacity:0}}#eyes{transform-origin:80px 56px;animation:blink 4s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<path id="tail" d="M112 138 Q150 140 147 102 Q145 84 133 87 Q139 102 136 114 Q131 128 110 127 Z" fill="#2b2b2b" stroke="#3b3934" stroke-width="2" stroke-linejoin="round"/><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="body" fill="#2b2b2b"><ellipse cx="80" cy="113" rx="40" ry="35"/><rect x="60" y="118" width="14" height="32" rx="7"/><rect x="86" y="118" width="14" height="32" rx="7"/></g></g><g fill="#fbfaf6"><ellipse cx="80" cy="100" rx="15" ry="22"/><ellipse cx="67" cy="146" rx="9" ry="6"/><ellipse cx="93" cy="146" rx="9" ry="6"/></g><g stroke="#3b3934" stroke-width="2" stroke-linejoin="round"><g id="head" fill="#2b2b2b"><polygon id="ear-left" points="57,46 59,17 78,34"/><polygon id="ear-right" points="103,46 102,27 93,24 82,34"/><circle cx="80" cy="58" r="26"/></g></g><g id="eyes"><ellipse cx="70" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#888" stroke-width="1"/><ellipse cx="90" cy="56" rx="4" ry="5" fill="#c8d65a" stroke="#888" stroke-width="1"/><ellipse cx="70" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/><ellipse cx="90" cy="56" rx="1.4" ry="3.5" fill="#1d1d1d"/></g><polygon id="nose" points="76,66 84,66 80,71" fill="#d98a94" stroke="#2b2b2b" stroke-width="1"/><path id="heart" d="M128 30 C128 24 120 22 118 28 C116 22 108 24 108 30 C108 37 118 42 118 42 C118 42 128 37 128 30 Z" fill="#d64185"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="A poor cat photo: the cat is tiny, far away, turned away, blurry and in shadow">
  <defs>
    <clipPath id="p-frame"><rect x="10" y="10" width="280" height="280" rx="22"/></clipPath>
    <filter id="p-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
  </defs>
  <g clip-path="url(#p-frame)">
    <rect x="10" y="10" width="280" height="280" fill="#f4f2ec"/>
    <rect x="10" y="215" width="280" height="75" fill="#d7dee4"/>
    <rect x="200" y="30" width="70" height="185" rx="35" fill="#a3d1f2"/>
    <circle cx="60" cy="55" r="18" fill="#ffe0a0"/>
    <!-- shadow over most of the frame -->
    <path d="M10 10 H190 L120 290 H10 Z" fill="#1b2a38" opacity="0.35"/>
    <!-- tiny cat, back turned, blurred -->
    <g filter="url(#p-blur)" transform="translate(60 205)">
      <path d="M14 30 C -4 30, -6 14, 4 6" fill="none" stroke="#e07856" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="24" cy="28" rx="16" ry="13" fill="#e07856"/>
      <circle cx="24" cy="12" r="10" fill="#e07856"/>
      <path d="M16 7 L17 -3 L22 4 Z M32 7 L31 -3 L26 4 Z" fill="#e07856"/>
    </g>
    <!-- a stray thumb in the corner -->
    <ellipse cx="282" cy="40" rx="34" ry="46" fill="#ee9070" opacity="0.85"/>
  </g>
  <rect x="10" y="10" width="280" height="280" rx="22" fill="none" stroke="#1b2a38" stroke-width="4"/>
  <!-- cross badge -->
  <circle cx="262" cy="262" r="30" fill="#b8552f" stroke="#fefcf7" stroke-width="5"/>
  <path d="M250 250 l24 24 M274 250 l-24 24" stroke="#fefcf7" stroke-width="7" stroke-linecap="round"/>
</svg>

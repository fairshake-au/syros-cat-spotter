<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="A good cat photo: the cat fills the frame, face and whole body visible, in daylight">
  <defs><clipPath id="g-frame"><rect x="10" y="10" width="280" height="280" rx="22"/></clipPath></defs>
  <g clip-path="url(#g-frame)">
    <rect x="10" y="10" width="280" height="280" fill="#f4f2ec"/>
    <rect x="10" y="215" width="280" height="75" fill="#d7dee4"/>
    <rect x="200" y="30" width="70" height="185" rx="35" fill="#a3d1f2"/>
    <circle cx="60" cy="55" r="18" fill="#ffe0a0"/>
    <!-- tail -->
    <path d="M205 238 C 255 238, 262 200, 240 178" fill="none" stroke="#e07856" stroke-width="16" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="150" cy="200" rx="68" ry="52" fill="#e07856"/>
    <path d="M110 170 q8 18 0 36 M135 160 q8 22 0 46 M190 168 q-8 20 0 40" stroke="#b8552f" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- front legs -->
    <rect x="118" y="215" width="22" height="42" rx="11" fill="#e07856"/>
    <rect x="160" y="215" width="22" height="42" rx="11" fill="#e07856"/>
    <ellipse cx="129" cy="256" rx="14" ry="7" fill="#fefcf7"/>
    <ellipse cx="171" cy="256" rx="14" ry="7" fill="#fefcf7"/>
    <!-- head -->
    <path d="M102 92 L112 44 L140 78 Z" fill="#e07856"/>
    <path d="M198 92 L188 44 L160 78 Z" fill="#e07856"/>
    <path d="M110 84 L115 58 L130 76 Z" fill="#f6a9c8"/>
    <path d="M190 84 L185 58 L170 76 Z" fill="#f6a9c8"/>
    <circle cx="150" cy="112" r="52" fill="#e07856"/>
    <path d="M150 62 v16 M136 66 l4 14 M164 66 l-4 14" stroke="#b8552f" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="150" cy="132" rx="26" ry="18" fill="#fefcf7"/>
    <ellipse cx="130" cy="108" rx="9" ry="11" fill="#1b2a38"/>
    <ellipse cx="170" cy="108" rx="9" ry="11" fill="#1b2a38"/>
    <circle cx="133" cy="104" r="3" fill="#fefcf7"/>
    <circle cx="173" cy="104" r="3" fill="#fefcf7"/>
    <path d="M144 124 h12 l-6 7 z" fill="#d64185"/>
    <path d="M150 131 q-6 8 -12 4 M150 131 q6 8 12 4" stroke="#1b2a38" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M118 128 h-26 M118 135 l-24 6 M182 128 h26 M182 135 l24 6" stroke="#47596a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- viewfinder corners -->
  <path d="M30 60 V30 H60 M240 30 H270 V60 M270 240 V270 H240 M60 270 H30 V240" fill="none" stroke="#fefcf7" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  <rect x="10" y="10" width="280" height="280" rx="22" fill="none" stroke="#1b2a38" stroke-width="4"/>
  <!-- tick badge -->
  <circle cx="262" cy="262" r="30" fill="#5f6f36" stroke="#fefcf7" stroke-width="5"/>
  <path d="M248 263 l10 10 l19 -21" fill="none" stroke="#fefcf7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
